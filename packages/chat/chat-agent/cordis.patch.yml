# The dsh-chat-agent bundle patch: the desktop-surface layer over dsh-base.
# It mounts the HTTP/API transport (webserver + api-gateway), the storage
# stack for the chat domains, and the chat plugin family (bot registry +
# group orchestration). No browser roster and no frontend dist: the Tauri
# desktop app (apps/desktop) is the client and speaks plain HTTP/WS to
# 127.0.0.1:3180.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# Bot personas are per-agent scoped prompt sections (chat-bots); keep the
# base persona empty so it adds nothing beside the harness identity.
- id: system-prompt
  config:
    persona: ''

# Chat companions must not inherit workspace/project instructions: bot
# workspaces live inside this repo, so the walk-up would feed the harness
# repo's AGENTS.md (16KB of contributor guidelines) into every first prompt.
# maxBytes: 0 disables instruction loading entirely for this profile.
- id: agent-instructions
  config:
    maxBytes: 0

# The model-facing skill catalog (~10KB) and the `skill` loader tool are
# dev-tooling noise for chat bots (legacy bots start with no skills); the
# dsh-skill registry itself stays mounted for the settings page.
- id: tool-skill
  disabled: true

# The shared module-reload HMR row stays off; the desktop app reloads itself.
- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Search: the composite chat provider replaces the stock DeepSeek-only row —
# DeepSeek native search when the Models-page key exists, keyless DuckDuckGo
# Lite otherwise, Bing HTML as the final fallback. Pin the seam to its id so
# the (now disabled) deepseek-official registration never makes selection
# ambiguous.
- id: web
  config:
    searchProvider: chat-search

- id: web-search-deepseek
  disabled: true

- insert:
    # ── storage stack for the chat domains ────────────────────────────────────
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # ── transport layer ───────────────────────────────────────────────────────
    # Workspace registry + directory picker satisfy the API gateway's inject
    # list (the desktop client never calls them, but the services must exist).
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Plain route-registration carrier; the desktop app connects from the
    # Tauri webview over loopback (trusted by the Host fence by default).
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 3180

    # The API gateway: standard session/llm/credentials RPC under /api plus
    # the server-request (respond) channel. The chat business RPC lives on
    # /chatapi/* registered by the chat plugins themselves.
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    # ── the chat plugin family ────────────────────────────────────────────────
    - id: chat-bots
      name: '@deepseek-ai/dsh-chat-bots'

    # Composite search provider (deepseek → duckduckgo → bing degradations).
    - id: chat-web-search
      name: '@deepseek-ai/dsh-chat-web-search'

    - id: chat-group
      name: '@deepseek-ai/dsh-chat-group'
      config:
        # 硬上限，不是目标轮数：调度模型判断无人需要回应时会返回 [] 自然终止。
        # 放宽是因为「你俩聊聊」这类诉求需要多轮一来一回才成形，而每轮都由
        # 调度模型把关，不会空转烧 token。调小可让群聊更快收束。
        maxGroupRounds: 10
        contextWindow: 20
